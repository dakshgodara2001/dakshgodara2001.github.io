    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='6' fill='%23f2eee5'/%3E%3Ctext x='32' y='42' font-family='Georgia,serif' font-size='22' letter-spacing='1' fill='%231c2430' text-anchor='middle'%3EDYG%3C/text%3E%3C/svg%3E">
    <meta name="theme-color" content="#f2eee5">

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <style>
        :root {
            --paper: #f2eee5;
            --card:  #fbf9f4;
            --ink:   #1c2430;
            --muted: #6f6a60;
            --faint: #a39d91;
            --pink:  #e0218a;          /* Barbie pink: the one colour, kept to the turn mark */
            --select: #73a89a;         /* selection, after instinct.co: a muted sage block, ivory type */
            --select-ink: #fdfcfb;
        }
        ::selection      { background: var(--select); color: var(--select-ink); text-shadow: none; }
        ::-moz-selection { background: var(--select); color: var(--select-ink); text-shadow: none; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html { -webkit-text-size-adjust: 100%; height: 100%; overflow: hidden; overscroll-behavior: none; }
        body {                       /* one screen, pinned: nothing to scroll, no rubber-band */
            position: fixed; inset: 0; overflow: hidden; overscroll-behavior: none;
            display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1.8rem;
            padding: 2rem 1rem;
            background: var(--paper); color: var(--ink);
            font-family: "Inter", system-ui, sans-serif; font-size: 12.5px; line-height: 1.6;
            -webkit-font-smoothing: antialiased;
        }
        a { color: inherit; text-decoration: none; }

        /* one picture behind the card: Bateman reading it, the boardroom blinds and panelling around
           him. The script places it from the card's position on every screen (his eyes just above
           the card, his gaze falling on it); these values are the desktop fallback without script. */
        .portrait {
            position: fixed; z-index: 0; pointer-events: none; user-select: none;
            height: 112vh; aspect-ratio: 5421 / 1820;
            /* eyes (47% across, 33% down the picture) just above the card and a little left of it,
               so his downward gaze falls on the card */
            top: -10.5vh; left: calc(48vw - 156.83vh);
            opacity: 0; animation: surface 3s .8s ease forwards;
            isolation: isolate;
        }
        /* tall phones: the face is sized to the width so both eyes show, and the engraving
           fades into the paper above his hair and below his chin, like an engraved vignette */
        .portrait.vignette {
            -webkit-mask-image: linear-gradient(to bottom, transparent, #000 13%, #000 76%, transparent);
                    mask-image: linear-gradient(to bottom, transparent, #000 13%, #000 76%, transparent);
        }
        @keyframes surface { to { opacity: .34; } }
        /* his look hardens when the card is turned: the brows and eyes are redrawn in five even
           steps (the brows lead, the lids tighten after, the frown lines settle last) and each
           step is cross-faded into the next additively, so the engraved lines keep their exact
           weight at every moment */
        .portrait img { position: absolute; display: block; mix-blend-mode: plus-lighter; }
        .portrait .room { inset: 0; width: 100%; height: 100%;
            clip-path: polygon(evenodd, 0 0, 100% 0, 100% 100%, 0 100%, 0 0,
                28.1129% 0, 64.8589% 0, 64.8589% 54.5055%, 28.1129% 54.5055%, 28.1129% 0); }
        .portrait .still { inset: 0; width: 100%; height: 100%; clip-path: inset(0 35.1411% 45.4945% 28.1129%); will-change: opacity; }
        .portrait .stare { left: 28.1129%; top: 0; width: 36.7460%; height: 54.5055%; opacity: 0; will-change: opacity; }
        .stage, .turn { position: relative; z-index: 1; }

        .stage {
            /* a landscape card on every screen; never taller than ~42% of the screen, so his eyes
               always have room above it */
            width: min(540px, 88vw, 73.5svh); aspect-ratio: 1.75;
            container-type: inline-size;              /* type below is sized to the card itself */
            perspective: 1600px; cursor: pointer;
            -webkit-tap-highlight-color: transparent;
            animation: appear 1s ease both;
        }
        @keyframes appear { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

        .card {
            position: relative; width: 100%; height: 100%;
            transform-style: preserve-3d;
            transition: transform .9s cubic-bezier(.6, .04, .22, 1);
        }

        .face {
            position: absolute; inset: 0;
            backface-visibility: hidden; -webkit-backface-visibility: hidden;
            background: var(--card); border-radius: 2px;
            box-shadow: 0 0 0 .5px rgba(28, 36, 48, .06), 0 1px 2px rgba(28, 36, 48, .06), 0 18px 40px -22px rgba(28, 36, 48, .3);
        }

        /* small tracked capitals, used for every label */
        .label { font-size: max(7px, 1.76cqw); font-weight: 500; letter-spacing: .22em; text-transform: uppercase; color: var(--faint); }

        /* ---------- front: two top corners, a centre, a line at the foot ---------- */
        .front {
            display: flex; flex-direction: column; justify-content: space-between;
            padding: 8% 8.5%;
        }
        .top { position: relative; z-index: 1; display: flex; justify-content: space-between; align-items: flex-start; }
        .social { display: flex; gap: max(9px, 2.6cqw); padding-top: .74cqw; }
        .social a { color: var(--faint); display: block; transition: color .2s; }
        .social a:hover, .social a:focus-visible { color: var(--ink); outline: none; }
        .social svg { display: block; width: max(11px, 2.6cqw); height: max(11px, 2.6cqw); }

        .firm { text-align: right; }
        .firm .brand {
            font-family: "Cormorant Garamond", serif; font-weight: 500;
            font-size: max(13px, 3.85cqw); line-height: 1; letter-spacing: .01em;
        }

        .who {                       /* sits in the true centre of the card, under the corners */
            position: absolute; inset: 0; pointer-events: none;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            text-align: center;
        }
        .name {
            font-family: "Cormorant Garamond", Garamond, serif; font-weight: 500;
            font-size: max(13px, 4.89cqw); letter-spacing: .3em; text-transform: uppercase;
            line-height: 1.2; margin-right: -.3em;    /* balance the trailing tracking so it centres */
        }
        .title {
            font-family: "Cormorant Garamond", serif; font-style: italic;
            font-size: max(12px, 3.5cqw); color: var(--muted); margin-top: .3em;
        }

        .coords { position: relative; text-align: center; letter-spacing: .26em; opacity: .8; font-variant-numeric: tabular-nums; }

        /* ---------- back: one centred column ---------- */
        .back {
            transform: rotateY(180deg); cursor: default;
            display: flex; flex-direction: column; justify-content: center; gap: 4.2cqw;
            text-align: center; padding: 6% 8%;
        }
        .back .label { margin-bottom: 1.1cqw; }
        .back p {                    /* same serif as the front; labels stay in the small capitals */
            font-family: "Cormorant Garamond", Garamond, serif; font-weight: 500;
            font-size: max(11.5px, 3.38cqw); line-height: 1.35; letter-spacing: .01em;
        }
        .back .yr { color: var(--muted); font-style: italic; font-weight: 400; margin-left: .5em; }
        .back p a { border-bottom: 1px solid rgba(28, 36, 48, .16); transition: border-color .2s; }
        .back p a:hover, .back p a:focus-visible { border-color: var(--ink); outline: none; }

        .turn {
            display: grid; place-items: center; width: 40px; height: 40px;
            color: var(--pink); background: none; border: none; border-radius: 50%; cursor: pointer;
            transition: color .2s;
            animation: appear 1s .4s ease both;
        }
        .turn:hover, .turn:focus-visible { color: #b8176f; outline: none; }

        @media (prefers-reduced-motion: reduce) {
            .stage, .turn { animation: none; }
            .portrait { animation: none; opacity: .34; }
            .card { transition: none; }
        }

        /* ---------- back, the dateline: the years as a large light numeral, the rest as one line of prose ---------- */
        .back { justify-content: center; gap: 5cqw; text-align: left; padding: 7% 8.5%; }
        .back .lead { display: flex; align-items: center; gap: 4.5cqw; }
        .back .years {
            font-family: "Cormorant Garamond", serif; font-style: italic; font-weight: 400;
            font-size: max(40px, 13.5cqw); line-height: .8; letter-spacing: -.02em; color: var(--ink);
            padding-right: 4.5cqw; border-right: 1px solid rgba(28, 36, 48, .14);
        }
        .back .years span { color: var(--faint); margin: 0 .04em; }
        .back .lead .label { margin-bottom: .9cqw; }
        .back .role { font-size: max(14px, 4.3cqw); line-height: 1.2; }
        .back .prose { font-style: italic; font-weight: 400; color: var(--muted);
            font-size: max(11.5px, 3.05cqw); line-height: 1.5; max-width: 40em; }
        .back .nowrap { white-space: nowrap; }
    </style>
</head>
<body>
    <div class="portrait" id="portrait" aria-hidden="true">
        <img class="room" src="assets/scene.webp" alt="">
        <img class="still" src="assets/scene.webp" alt="">
        <img class="stare" data-src="assets/stare-1.webp" alt="">
        <img class="stare" data-src="assets/stare-2.webp" alt="">
        <img class="stare" data-src="assets/stare-3.webp" alt="">
        <img class="stare" data-src="assets/stare-4.webp" alt="">
        <img class="stare" data-src="assets/stare-5.webp" alt="">
    </div>

    <main class="stage" id="stage">
        <div class="card" id="card">
            <section class="face front" id="front">
                <div class="top">
                    <nav class="social" aria-label="Elsewhere">
                        <a href="https://linkedin.com/in/daksh-godara-2001" target="_blank" rel="noopener" aria-label="LinkedIn" title="LinkedIn">
                            <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M20.447 20.452h-3.554v-5.569c0-1.328-.027-3.037-1.852-3.037-1.853 0-2.136 1.445-2.136 2.939v5.667H9.351V9h3.414v1.561h.046c.477-.9 1.637-1.85 3.37-1.85 3.601 0 4.267 2.37 4.267 5.455v6.286zM5.337 7.433a2.062 2.062 0 1 1 0-4.125 2.062 2.062 0 0 1 0 4.125zM7.119 20.452H3.555V9h3.564v11.452zM22.225 0H1.771C.792 0 0 .774 0 1.729v20.542C0 23.227.792 24 1.771 24h20.451C23.2 24 24 23.227 24 22.271V1.729C24 .774 23.2 0 22.222 0h.003z"/></svg>
                        </a>
                        <a href="https://x.com/daksh1x3" target="_blank" rel="noopener" aria-label="X" title="X">
                            <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M18.901 1.153h3.68l-8.04 9.19L24 22.846h-7.406l-5.8-7.584-6.638 7.584H.474l8.6-9.83L0 1.154h7.594l5.243 6.932ZM17.61 20.644h2.039L6.486 3.24H4.298Z"/></svg>
                        </a>

                        </a>
                    </nav>
                    <div class="firm">
                        <a class="brand" href="https://nimaraa.ai" target="_blank" rel="noopener">nimaraa labs</a>

                </div>
                <div class="who">
                    <h1 class="name">Daksh Godara</h1>
                    <p class="title">Founder</p>
                </div>
                <p class="coords label" title="New Delhi">28.61° N &nbsp;77.21° E</p>
            </section>

            <section class="face back" id="back" aria-hidden="true" inert>
                <div class="lead">
                    <p class="years" aria-label="2023 to 2026">23<span>–</span>26</p>
                    <div>
                        <h2 class="label">Previously</h2>
                        <p class="role">Product Manager,<br><a href="https://www.indmoney.com" target="_blank" rel="noopener">INDmoney</a></p>
                    </div>
                </div>
                <p class="prose">Before that, Electrical Engineering at NSIT Delhi, <span class="nowrap">class of 2023.</span></p>
            </section>
        </div>
    </main>

    <button class="turn" id="turn" aria-pressed="false" aria-controls="card" aria-label="Turn over" title="Turn over">
        <svg width="19" height="19" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M13.5 8a5.5 5.5 0 1 1-1.8-4.07"/><path d="M12 1.6v2.6H9.4"/></svg>
    </button>

    <script>
        const stage = document.getElementById('stage');
        const card = document.getElementById('card');
        const front = document.getElementById('front');
        const back = document.getElementById('back');
        const turn = document.getElementById('turn');

        // total rotation in degrees; every turn adds or removes half a revolution,
        // so the card keeps spinning the way it was pushed instead of snapping back
        let angle = 0;

        function turnCard(dir) {                  // dir: +1 clockwise (right edge goes back), -1 anticlockwise
            angle += dir * 180;
            card.style.transform = `rotateY(${angle}deg)`;
            const onBack = Math.abs(angle / 180) % 2 === 1;
            front.inert = onBack; back.inert = !onBack;
            front.setAttribute('aria-hidden', onBack); back.setAttribute('aria-hidden', !onBack);
            turn.setAttribute('aria-pressed', onBack);
            turn.setAttribute('aria-label', onBack ? 'Turn back' : 'Turn over');
            turn.title = onBack ? 'Turn back' : 'Turn over';
            harden(onBack ? 1 : 0);
        }

        // ---- his expression: the still face on the front, the hard stare on the back ----
        const faces = [document.querySelector('.portrait .still'), ...document.querySelectorAll('.portrait .stare')];
        const quiet = matchMedia('(prefers-reduced-motion: reduce)');
        let mood = 0, goal = 0, frame = 0;
        // the stare is fetched once the page has settled, and only shown once it is decoded
        const ready = new Promise(res => addEventListener('load', () => {
            const late = faces.slice(1);
            const loaded = img => new Promise(ok => {
                img.addEventListener('load', ok, { once: true });
                img.addEventListener('error', ok, { once: true });
                img.src = img.dataset.src;
            }).then(() => Promise.race([img.decode().catch(() => {}), new Promise(ok => setTimeout(ok, 400))]));
            Promise.all(late.map(loaded)).then(res);
        }));
        function paint(m) {                       // m: 0 still .. 1 stare, spread over the frames
            const x = m * (faces.length - 1);
            faces.forEach((img, i) => { img.style.opacity = Math.max(0, 1 - Math.abs(x - i)); });
        }
        function harden(to) {
            goal = to;
            ready.then(() => {
                cancelAnimationFrame(frame);
                const from = mood, start = performance.now();
                // the brows gather slowly as the card turns, and ease off a little quicker;
                // a turn caught halfway only travels the rest of the way, in proportion
                const delay = to && !quiet.matches ? 150 : 0;
                const dur = (quiet.matches ? 300 : (to ? 1500 : 1000)) * Math.max(.3, Math.abs(goal - from));
                const step = () => {
                    const t = Math.min(1, Math.max(0, (performance.now() - start - delay) / dur));
                    const e = t * t * t * (t * (6 * t - 15) + 10);   // smootherstep: no jolt at either end
                    mood = from + (goal - from) * e;
                    paint(mood);
                    if (t < 1) frame = requestAnimationFrame(step);
                };
                frame = requestAnimationFrame(step);
            });
        }

        // ---- the portrait, placed from the card on every screen ----
        // the picture: eyes 47.01% across and 33% down, his face about 0.58 of its height between the eyes
        const portrait = document.getElementById('portrait');
        const RATIO = 5421 / 1820, EYE_X = .4701, EYE_Y = .33, LIFT = .037;
        function place() {
            const W = document.body.clientWidth, H = document.body.clientHeight;
            stage.style.marginTop = '';
            let cardTop = stage.offsetTop;
            const cx = stage.offsetLeft + stage.offsetWidth / 2;
            // fill the screen, with the eyes a little above the card...
            let h = Math.max(1.12 * H, cardTop / (EYE_Y + LIFT), (H - cardTop) / (1 - EYE_Y - LIFT));
            const vignette = h > 1.25 * W;          // ...unless that would push an eye off a tall screen
            let lift = LIFT;
            if (vignette) {
                h = Math.min(1.22 * W, H);          // both eyes in, the face centred on the screen,
                lift = .075;                        // a small face needs a little more room above the card
                const shift = (H - h) / 2 + (EYE_Y + lift) * h - cardTop;   // and the card moved to meet it
                stage.style.marginTop = 2 * shift + 'px';
                cardTop += shift;
            }
            const w = h * RATIO;
            const top = cardTop - (EYE_Y + lift) * h;
            // eyes a touch left of the card's centre, so his gaze falls on it; never leave a gap at the sides
            let left = cx - .02 * W - EYE_X * w;
            left = Math.min(0, Math.max(W - w, left));
            portrait.classList.toggle('vignette', vignette);
            Object.assign(portrait.style, { height: h + 'px', top: top + 'px', left: left + 'px' });
        }
        place();
        let pending = 0;
        const replace = () => { cancelAnimationFrame(pending); pending = requestAnimationFrame(place); };
        addEventListener('resize', replace);
        new ResizeObserver(replace).observe(document.body);   // also catches mobile toolbars showing and hiding

        // click the right half to turn clockwise, the left half to turn anticlockwise; but a click
        // that is really reading (dragging a selection, double-clicking a word, clearing a selection)
        // leaves the card where it is
        const selected = () => { const s = getSelection(); return s && !s.isCollapsed && stage.contains(s.anchorNode); };
        let press = null, wait = 0;
        stage.addEventListener('pointerdown', e => { press = { x: e.clientX, y: e.clientY, had: selected(), touch: e.pointerType === 'touch' }; });
        stage.addEventListener('click', e => {
            clearTimeout(wait);
            if (e.target.closest('a') || e.detail > 1) return;
            const moved = press && Math.hypot(e.clientX - press.x, e.clientY - press.y) > 4;
            if (moved || (press && press.had) || selected()) return;
            const r = stage.getBoundingClientRect();
            const dir = e.clientX >= r.left + r.width / 2 ? 1 : -1;
            // on words, wait a beat in case it is the first half of a double-click
            const onText = e.target.closest('h1, h2, p, .label, .coords, .brand');
            if (onText && !(press && press.touch)) wait = setTimeout(() => { if (!selected()) turnCard(dir); }, 220);
            else turnCard(dir);
        });
        turn.addEventListener('click', () => turnCard(1));

        if (location.hash === '#back') {           // open on the back without animating
            card.style.transition = 'none';
            turnCard(1);
            card.offsetWidth;
            card.style.transition = '';
        }
    </script>
</body>
